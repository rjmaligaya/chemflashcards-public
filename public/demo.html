<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChemFlashcards demo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="v2-style.css">
  <style>
    /* ── Two-column layout ───────────────────────────────────────────── */
    #demo-app {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: var(--space-xl);
      max-width: 1140px;
      margin: var(--space-md) auto;
      padding: 0 var(--space-md);
      align-items: start;
    }
    @media (max-width: 820px) {
      #demo-app {
        grid-template-columns: 1fr;
        gap: var(--space-md);
      }
    }

    /* ── TOC sidebar ─────────────────────────────────────────────────── */
    #demo-toc {
      position: sticky;
      top: var(--space-md);
      padding: var(--space-md);
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }
    #demo-toc h3 {
      margin: 0 0 var(--space-sm);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .toc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .toc-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: var(--space-xs) var(--space-sm);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--color-text);
      font: 500 0.92rem/1.35 inherit;
      cursor: pointer;
    }
    .toc-item:hover { background: var(--color-accent-dim); }
    .toc-item.is-active {
      background: var(--color-accent-dim);
      border-color: var(--color-accent);
      color: var(--color-text);
    }
    .toc-item.is-preview {
      color: var(--color-muted);
      font-weight: 400;
      font-style: italic;
    }
    .toc-item.is-locked {
      color: var(--color-muted);
      cursor: not-allowed;
      opacity: 0.6;
    }
    .toc-sublabel {
      display: block;
      font-size: 0.78rem;
      color: var(--color-muted);
      font-style: italic;
      margin-top: 2px;
    }

    /* ── Content card ────────────────────────────────────────────────── */
    #demo-content {
      min-height: 480px;
    }
    .demo-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-xl);
    }

    /* ── Rule box (cyclo tutorial) ───────────────────────────────────── */
    .demo-rule-box {
      background: var(--color-accent-dim);
      color: var(--color-text);
      border-left: 3px solid var(--color-accent);
      border-radius: var(--radius-md);
      padding: var(--space-md) var(--space-lg);
      margin: var(--space-md) 0 var(--space-lg);
      font-size: 1.02rem;
      line-height: 1.55;
    }

    /* ── Inline cyclohexane SVG (cyclo tutorial section) ─────────────── */
    .demo-mol-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      margin: var(--space-md) 0;
    }
    .demo-mol-svg {
      width: 240px;
      height: auto;
      display: block;
    }
    .demo-mol-svg .ring-bonds path { fill: var(--color-text); }
    .demo-mol-svg .carbon-numbers text {
      font: 600 5px/1 "IBM Plex Mono", monospace;
      fill: var(--color-accent);
      letter-spacing: 0;
    }

    /* ── Skeletal structures picker (image + labels) ─────────────────── */
    .picker-image-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      padding: var(--space-lg);
      background: var(--color-bg, #fff);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }
    .picker-image-inner {
      position: relative;
      display: block;
      max-width: 100%;
      /* Width + height are set inline by demo-page.js based on each molecule's
         viewBox aspect ratio, so wide chains fill more horizontal space and
         square rings stay compact. */
    }
    .picker-image {
      display: block;
      width: 100%;
      height: 100%;
    }
    .picker-label {
      margin: var(--space-md) 0 var(--space-2xs);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-text);
    }
    .picker-detail {
      margin: 0 0 var(--space-md);
      color: var(--color-muted);
      font-size: 0.92rem;
    }
    .picker-control-label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin: var(--space-md) 0 var(--space-2xs);
    }
    .picker-btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2xs);
    }
    .picker-btn {
      padding: 6px 12px;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-pill);
      color: var(--color-text);
      font: 500 0.88rem/1 inherit;
      cursor: pointer;
    }
    .picker-btn:hover:not(:disabled) {
      border-color: var(--color-accent);
    }
    .picker-btn.is-active {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: var(--color-bg, #fff);
    }
    .picker-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .picker-toggle-row {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-top: var(--space-2xs);
    }
    .picker-hint {
      color: var(--color-muted);
      font-size: 0.85rem;
    }

    /* ── Footer (Continue / Restart) ─────────────────────────────────── */
    .demo-footer {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-sm);
      margin-top: var(--space-xl);
    }

    /* ── Preview placeholder (locked sections) ──────────────────────── */
    .preview-card {
      background: var(--color-accent-dim);
      border: 1px dashed var(--color-accent);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      color: var(--color-text);
    }
    .preview-card h3 { margin: 0 0 var(--space-xs); }
    .preview-card p  { margin: 0; color: var(--color-muted); line-height: 1.55; }
  </style>
</head>
<body>
  <header class="topbar" role="banner">
    <div class="topbar__inner">
      <a href="index.html" class="topbar__logo">ChemFlashcards</a>
    </div>
  </header>

  <main id="demo-app">
    <aside id="demo-toc" aria-label="Tutorial outline">
      <p style="text-align:center;color:var(--color-muted);margin:0;">Loading...</p>
    </aside>
    <section id="demo-content">
      <p style="text-align:center;color:var(--color-muted);margin:80px 0;">Loading...</p>
    </section>
  </main>

  <script type="module">
    import { runDemoPage } from "./demo-page.js";
    runDemoPage();
  </script>
  <!-- Tester tools: self-gating; renders only when the URL carries a DEV test id. Invisible to real participants. -->
  <script type="module" src="tester-tools.js"></script>
</body>
</html>
